<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ملف الضيف وتفاصيل الحجز</title>
<!-- Source of assets/handoff/guest-file.pdf (the document attached in the ERP-to-WhatsApp handoff scene).
     Rendered from data/booking.js + data/handoff-script.js, printed by tools/build_handoff_pdf.py (headless Edge, A4). -->
<link rel="stylesheet" href="../css/site.css">
<style>
  @page { size: A4; margin: 0; }
  html, body { margin: 0; background: #fff; }
  body { width: 210mm; font-family: var(--arabic); color: var(--charcoal-900); font-size: 9.8pt; line-height: 1.42; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { box-sizing: border-box; width: 210mm; min-height: 297mm; padding: 13mm 15mm 11mm; display: flex; flex-direction: column; }
  .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10mm; padding-bottom: 4.5mm; border-bottom: 1.2pt solid var(--charcoal-900); }
  h1 { font-family: "Fedra Serif Arabic AR", var(--arabic); font-weight: 600; font-size: 19pt; line-height: 1.25; margin: 0 0 1.5mm; }
  .sub { color: var(--charcoal-700); font-size: 9.5pt; margin: 0; }
  .logo { width: 38mm; height: auto; margin-top: 1mm; }
  .assign { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 5mm; margin: 4.5mm 0 0; padding: 3mm 4.5mm; background: var(--sand-50); border: 0.6pt solid var(--sand-100); border-radius: 2mm; }
  .assign img { width: 13mm; height: 13mm; border-radius: 50%; object-fit: cover; }
  .assign .k { color: var(--charcoal-700); font-size: 8.8pt; }
  .assign .v { font-weight: 600; font-size: 12pt; }
  .badge { font-size: 9pt; font-weight: 600; color: var(--aqua-900); background: var(--aqua-50); border: 0.6pt solid var(--aqua-200); border-radius: 1.5mm; padding: 1.5mm 3mm; white-space: nowrap; }
  section { margin-top: 4.2mm; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; align-items: start; }
  .pair section { margin-top: 4.2mm; }
  .pair dl { grid-template-columns: 22mm 1fr; }
  h2 { font-size: 10pt; font-weight: 600; letter-spacing: .2pt; color: var(--aqua-700); margin: 0 0 1mm; padding-bottom: 1.2mm; border-bottom: 0.6pt solid var(--charcoal-100); }
  dl { display: grid; grid-template-columns: 36mm 1fr; margin: 0; }
  dt, dd { margin: 0; padding: 1.05mm 0; border-bottom: 0.4pt solid var(--charcoal-50); }
  dt { color: var(--charcoal-700); }
  dd { font-weight: 500; }
  dd small { display: block; color: var(--charcoal-700); font-weight: 400; font-size: 8.6pt; }
  .total dd.sum { font-size: 12pt; font-weight: 700; }
  .action { margin-top: 4.2mm; padding: 3mm 4mm; border-inline-start: 1.6pt solid var(--aqua-500); background: var(--charcoal-25); }
  .action b { display: block; margin-bottom: 1mm; }
  footer { margin-top: auto; padding-top: 4mm; border-top: 0.6pt solid var(--charcoal-100); display: flex; justify-content: space-between; color: var(--charcoal-500); font-size: 8.5pt; }
</style>
</head>
<body>
<div class="page" id="doc"></div>
<script src="../data/booking.js"></script>
<script src="../data/handoff-script.js"></script>
<script>
(function () {
  var H = window.HANDOFF_SCENE, g = H.guest, b = H.booking, a = H.assignment;
  var LATIN = /[A-Za-z0-9+][A-Za-z0-9 .,:\/%+\-–@&'"_]*[A-Za-z0-9%.]|[A-Za-z0-9]/g;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  /* Latin and digit runs isolated left-to-right inside the Arabic line */
  function t(s) { return esc(s).replace(LATIN, function (m) { return '<span class="ltr">' + m + "</span>"; }); }
  function rows(list) { return "<dl>" + list.map(function (r) { return "<dt>" + t(r[0]) + "</dt><dd" + (r[2] ? ' class="' + r[2] + '"' : "") + ">" + r[1] + "</dd>"; }).join("") + "</dl>"; }
  var html = [
    '<header><div><h1>ملف الضيف وتفاصيل الحجز</h1>',
    '<p class="sub">مستند داخلي لفريق الضيافة · أُعدّ من ' + t(H.erp.app) + ' يوم ' + t(a.date) + '، الساعة ' + t(a.assignedAt) + '</p></div>',
    '<img class="logo" src="../assets/logos/shebara-logo-main-color.svg" alt="Shebara"></header>',
    '<div class="assign"><img src="../' + a.photo + '" alt="">',
    '<div><div class="k">' + t(H.erp.conciergeLabel) + '</div><div class="v">' + t(a.concierge) + ' · ' + t(a.role) + '</div></div>',
    '<span class="badge">' + t(g.category) + ' (الفئة <span class="ltr">' + esc(g.categoryCode) + '</span>)</span></div>',

    '<section><h2>بيانات الضيف</h2>' + rows([
      ["الضيف", t(g.fullName)],
      ["الجوال", '<span class="ltr">' + esc(g.mobile) + "</span>"],
      ["البريد الإلكتروني", '<span class="ltr">' + esc(g.email) + "</span>"],
      ["المرافقون", t(g.companion.name) + " <small>" + t(g.companion.relation.replace("زوجته", "زوجة الضيف")) + "</small>"]
    ]) + "</section>",

    '<section><h2>الإقامة</h2>' + rows([
      ["المنتجع", t(b.resort)],
      ["الفيلا", t(b.villaAr) + " <small>" + t(b.villa) + "</small>"],
      ["فئة السعر", t(b.rate)],
      ["الوصول", t(b.checkIn)],
      ["المغادرة", t(b.checkOut)],
      ["المدة والضيوف", t(b.nights + " · " + b.adults)]
    ]) + "</section>",

    '<section><h2>التنقلات</h2>' + rows([
      ["رحلة الوصول", t("من " + b.arrival.from + " إلى " + b.arrival.to) + " <small>" + t(b.arrival.product + (b.arrival.duration ? " · " + b.arrival.duration : "")) + "</small>"],
      ["رحلة المغادرة", t("من " + b.departure.from + " إلى " + b.departure.to) + " <small>" + t(b.departure.product) + "</small>"]
    ]) + "</section>",


    '<section class="total"><h2>المبلغ</h2>' + rows([
      ["الإقامة", t(b.accommodation)],
      ["التنقلات", t(b.transfers)],
      ["الإجمالي", t(b.total) + " <small>" + t(b.taxNote) + "</small>", "sum"]
    ]) + "</section>",

    '<div class="pair"><section><h2>الطلبات الخاصة</h2>' + rows([["طلب الضيف", t(g.request)]]) + "</section>",
    '<div class="action"><b>المطلوب من الكونسيرج</b>التواصل مع الضيف مباشرة على جواله لتنسيق تفاصيل الإقامة.</div></div>',
    '<footer><span>' + t(H.erp.app) + ' · ' + t(b.resort) + '</span><span>صفحة <span class="ltr">1 / 1</span></span></footer>'
  ];
  document.getElementById("doc").innerHTML = html.join("");
})();
</script>
</body>
</html>
