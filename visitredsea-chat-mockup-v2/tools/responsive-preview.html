<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2 — responsive design review</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#132f36;color:#f5efdf;font:13px/1.5 Arial,sans-serif}header{min-height:64px;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:10px 20px;border-bottom:1px solid #d4daba35;background:#173940}header strong{display:block;font-family:Georgia,serif;font-size:19px;font-weight:400}header small{font-size:11px;color:#bdcfc4}.controls{display:flex;gap:6px;flex-wrap:wrap}button,select{font:12px Arial,sans-serif;padding:8px 12px;min-height:36px;border:1px solid #bacabb70;border-radius:4px;background:#173940;color:#f6efda;cursor:pointer}select{max-width:170px}button[aria-pressed=true]{color:#244c48;background:#f7efdf;border-color:#f7efdf}.frame-wrap{display:flex;justify-content:center;min-width:0;padding:12px 0}iframe{display:block;border:0;max-width:100%;width:100%;height:calc(100dvh - 90px);min-height:540px;background:#183e43;box-shadow:0 7px 30px #001b2c55}button:focus-visible,select:focus-visible{outline:3px solid #abd3b8;outline-offset:2px}@media(max-width:640px){header{padding:9px 12px;gap:10px;align-items:flex-start}header strong{font-size:17px}header small{display:none}.controls{justify-content:flex-end}button,select{font-size:11px;padding:7px 8px}iframe{height:calc(100dvh - 90px);min-height:500px}}
</style></head><body><header><div><strong>Tidal Atelier · V2</strong><small>Live application in an iframe · resize without restarting the conversation</small></div><div class="controls" aria-label="Viewport"><select id="jump" aria-label="Review component" hidden><option value="resorts">Resorts</option><option value="detail">Resort details</option><option value="villas">Villa selection</option><option value="calendar">Calendar</option><option value="summary">Stay summary</option><option value="modes">Arrival modes</option><option value="airports">Airport form</option><option value="transport">Transfers</option><option value="experiences">Experiences</option><option value="guest">Guest form</option><option value="review">Final review</option><option value="otp">Email verification</option><option value="payment">Payment</option><option value="confirmation">Confirmation</option><option value="composer">Composer</option></select><button type="button" data-width="desktop" aria-pressed="true">Desktop</button><button type="button" data-width="390" aria-pressed="false">390 px</button><button type="button" data-width="360" aria-pressed="false">360 px</button></div></header><div class="frame-wrap"><iframe id="application" title="Working V2 concierge" src="../index.html?open=1"></iframe></div><script>
const frame=document.getElementById('application'),jump=document.getElementById('jump'),reviewParams=new URLSearchParams(location.search);
if(reviewParams.get('height')==='844')frame.style.height='844px';
if(reviewParams.get('recorded')==='1'){frame.src='../index.html?open=1&walkthrough=1&context=1';jump.hidden=false;document.querySelector('header small').textContent='Recorded journey for visual review · no email, microphone or checkout is triggered';}
document.querySelectorAll('button[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width==='desktop'?'100%':button.dataset.width+'px';document.querySelectorAll('button[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));
jump.addEventListener('change',()=>{const doc=frame.contentDocument,scroller=doc&&doc.getElementById('chat-scroll');if(!scroller)return;if(jump.value==='composer'){scroller.scrollTo({top:scroller.scrollHeight,behavior:'auto'});return}const target=doc.querySelector('.component[data-component="'+jump.value+'"]');if(target){const outer=target.closest('.rich');scroller.scrollTo({top:Math.max(0,outer.offsetTop-10),behavior:'auto'})}});
if(['390','360'].includes(reviewParams.get('width')))document.querySelector('button[data-width="'+reviewParams.get('width')+'"]').click();
if(reviewParams.get('recorded')==='1'){const ready=setInterval(()=>{const doc=frame.contentDocument;if(doc&&doc.body.classList.contains('recorded-chat-review')){clearInterval(ready);const requested=reviewParams.get('section');if([...jump.options].some(o=>o.value===requested))jump.value=requested;jump.dispatchEvent(new Event('change'));}},100);setTimeout(()=>clearInterval(ready),20000);}
</script></body></html>
