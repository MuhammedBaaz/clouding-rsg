<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSG chat context</title>
<script>
  /* pick the shell of the requested version before the stylesheets load */
  (function () { var v = new URLSearchParams(location.search).get("v") === "v2" ? "v2" : "v1"; document.documentElement.setAttribute("data-ver", v);
    var links = v === "v2" ? ["css/v2-site.css", "css/v2-chat.css", "css/v2-v2.css", "css/v2-atelier.css"] : ["css/v1-site.css", "css/v1-chat.css"];
    links.forEach(function (href) { document.write('<link rel="stylesheet" href="' + href + '">'); }); })();
</script>
<link rel="stylesheet" href="studio/studio-components.css">
<link rel="stylesheet" href="studio/studio-rtl.css">
<style>
  html, body { height: 100%; margin: 0; background: #e9ece9; }
  body { overflow: hidden; }
  /* the panel fills the frame instead of floating over a page */
  .chat-panel { position: absolute !important; inset: 0 !important; width: auto !important; height: 100% !important; right: 0 !important; bottom: 0 !important; border-radius: 0 !important; max-height: none !important; }
  .chat-panel[hidden] { display: flex !important; }
  .pv-note { display: inline-block; font-size: 11px; color: #7a6a3a; background: #fff4d6; border-radius: 4px; padding: 0 6px; margin-top: 4px; }
  .chat-composer .rec-box { display: none; }
</style>
</head>
<body class="chat-open">
<section class="chat-panel" id="chat-panel" role="dialog" aria-labelledby="chat-title">
  <div class="chat-head" lang="ar" dir="rtl">
    <img class="avatar" src="assets/logos/vrs-turtle-mark.svg" alt="" width="44" height="44">
    <div class="who">
      <div class="name" id="chat-title"></div>
      <div class="sub"><span class="online"></span></div>
    </div>
    <div class="menu-wrap"><button class="chat-icon" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button></div>
    <button class="chat-icon chat-close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="chat-scroll" id="chat-scroll" tabindex="0"></div>
  <form class="chat-composer" id="chat-composer" onsubmit="return false;">
    <div class="row">
      <textarea id="chat-input" class="field" rows="1" dir="auto" lang="ar" placeholder="" aria-label="Your message"></textarea>
      <button type="button" id="chat-mic" class="mic" aria-label="Record"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg></button>
      <button type="button" id="chat-send" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2-6z"/></svg></button>
    </div>
  </form>
</section>
<script>
  (function () { var v = document.documentElement.getAttribute("data-ver"); var head = document.querySelector(".chat-head");
    if (v === "v2") { document.getElementById("chat-title").textContent = "رفيق رحلتك"; document.querySelector(".online").textContent = "هنا لترتيب تفاصيل إقامتك"; document.getElementById("chat-input").placeholder = "كيف نقدر نساعدك؟"; }
    else { head.removeAttribute("dir"); head.removeAttribute("lang"); document.getElementById("chat-title").textContent = "Red Sea Concierge"; document.querySelector(".online").textContent = "Online"; document.getElementById("chat-input").placeholder = "اكتب رسالتك هنا"; } })();
</script>
<script src="data/v1/booking.js"></script><script src="data/v1/resorts.js"></script><script src="data/v1/villas.js"></script><script src="data/v1/script.js"></script>
<script>window.RSG_V1 = { BOOKING: window.BOOKING, RESORTS: window.RESORTS, VILLAS: window.VILLAS, SCRIPT: window.SCRIPT };</script>
<script src="data/v2/booking.js"></script><script src="data/v2/resorts.js"></script><script src="data/v2/villas.js"></script><script src="data/v2/script.js"></script>
<script>window.RSG_V2 = { BOOKING: window.BOOKING, RESORTS: window.RESORTS, VILLAS: window.VILLAS, SCRIPT: window.SCRIPT };</script>
<script src="studio/studio-renderers.js"></script>
<script src="studio/schemas.js"></script>
<script src="rsg-payloads.js"></script>
<script src="preview-chat.js"></script>
</body>
</html>
